name: Release macOS app

# Tag the app `vX.Y.Z` to release it. The edgee CLI it embeds is versioned
# separately — EDGEE_CLI below, overridable per run — so the app can ship a fix
# of its own without a new CLI release. Produces a DRAFT GitHub Release with a
# zipped, code-signed Edgee.app; publishing the draft triggers homebrew-cask.yml.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "App version without leading v (e.g. 0.5.1)"
        required: true
        type: string
      cli_version:
        description: "edgee CLI to embed, without leading v — must be a published edgee release. Blank = the EDGEE_CLI default in this workflow"
        required: false
        type: string

permissions:
  contents: write

env:
  # The edgee CLI release a tag push embeds — a manual run can override it with
  # the cli_version field, and the value lives with the tagged commit either way,
  # so rebuilding a tag rebuilds the same bundle. Bump it to move the CLI.
  EDGEE_CLI: "0.5.0"

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    env:
      # Apple signing is optional and dormant until these org/repo secrets exist.
      # When APPLE_SIGN_IDENTITY is set, the build is Developer-ID signed with a
      # hardened runtime, then notarized + stapled; otherwise it's ad-hoc signed.
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad app version '$V'"; exit 1; }
          # The CLI to embed: the field when a run supplies one, else the default.
          CLI="${{ inputs.cli_version }}"
          CLI="${CLI:-$EDGEE_CLI}"
          CLI="${CLI#v}"
          [[ "$CLI" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad edgee CLI version '$CLI'"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "cli=$CLI" >> "$GITHUB_OUTPUT"
          echo "app $V, embedding edgee CLI $CLI"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # edgee is public, so download the release asset directly — no token needed
      # (a fine-grained PAT scoped to the tap can't read edgee-ai/edgee anyway).
      # The pinned edgee release must be PUBLISHED (draft assets 404).
      - name: Fetch pinned edgee CLI (arm64 darwin)
        run: |
          URL="https://github.com/edgee-ai/edgee/releases/download/v${{ steps.v.outputs.cli }}/edgee.aarch64-apple-darwin"
          curl -fSL --retry 5 --retry-all-errors -o edgee-cli "$URL"
          chmod +x edgee-cli
          ./edgee-cli --version

      - name: Import Developer ID certificate
        if: ${{ env.APPLE_SIGN_IDENTITY != '' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build + package (arm64)
        run: |
          make dist EDGEE_BIN="$PWD/edgee-cli" \
            APP_VERSION="${{ steps.v.outputs.version }}" \
            CODESIGN_IDENTITY="${APPLE_SIGN_IDENTITY:--}"
          BUILT=$(ls dist/Edgee-*.zip)
          BUILT_VER=$(basename "$BUILT" .zip | sed 's/^Edgee-//')
          if [ "$BUILT_VER" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::bundle version $BUILT_VER != app version ${{ steps.v.outputs.version }} — version stamping went wrong"
            exit 1
          fi

      # Notarize the app and staple the ticket, then re-zip so the distributed
      # archive carries the ticket (stapling applies to the .app, not the zip).
      - name: Notarize + staple
        if: ${{ env.APPLE_SIGN_IDENTITY != '' }}
        run: |
          V="${{ steps.v.outputs.version }}"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool submit "dist/Edgee-$V.zip" \
            --key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple Edgee.app
          rm -f "dist/Edgee-$V.zip" "dist/Edgee-$V.zip.sha256"
          ditto -c -k --sequesterRsrc --keepParent Edgee.app "dist/Edgee-$V.zip"
          shasum -a 256 "dist/Edgee-$V.zip" | awk '{print $1}' > "dist/Edgee-$V.zip.sha256"

      - name: Create/refresh draft release + upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          V="${{ steps.v.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          gh release upload "$TAG" "dist/Edgee-$V.zip" "dist/Edgee-$V.zip.sha256" --clobber
